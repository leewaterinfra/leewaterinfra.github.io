<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>What happens to water between the street and the tap</title>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- ground -->
  <rect x="0" y="300" width="960" height="120" fill="#f3efe6"/>
  <line x1="0" y1="300" x2="960" y2="300" stroke="#b9ae98" stroke-width="1.5"/>
  <text x="20" y="410" font-size="12" fill="#8a7f6b">street</text>

  <!-- water main -->
  <rect x="0" y="352" width="330" height="18" rx="9" fill="#31688e"/>
  <text x="20" y="344" font-size="13" font-weight="600" fill="#31688e">Water main</text>

  <!-- service line -->
  <path d="M320 361 H470 V300" fill="none" stroke="#35b779" stroke-width="9" stroke-linecap="round"/>
  <text x="352" y="392" font-size="13" font-weight="600" fill="#218a58">Service line</text>

  <!-- building -->
  <rect x="440" y="40" width="300" height="260" fill="#fbfbfd" stroke="#6b6f7a" stroke-width="1.5"/>
  <path d="M430 40 L590 8 L750 40" fill="none" stroke="#6b6f7a" stroke-width="1.5"/>
  <line x1="440" y1="130" x2="740" y2="130" stroke="#d6d8de"/>
  <line x1="440" y1="215" x2="740" y2="215" stroke="#d6d8de"/>

  <!-- riser -->
  <path d="M470 300 V70 H700" fill="none" stroke="#35b779" stroke-width="6" stroke-linecap="round"/>
  <path d="M470 160 H700" fill="none" stroke="#35b779" stroke-width="5"/>
  <path d="M470 245 H560" fill="none" stroke="#35b779" stroke-width="5"/>

  <!-- water heater + hot loop -->
  <rect x="560" y="228" width="44" height="62" rx="8" fill="#fde2c8" stroke="#c2410c" stroke-width="1.5"/>
  <text x="582" y="264" font-size="11" text-anchor="middle" fill="#9a3412">heater</text>
  <path d="M604 245 H720 V100 H700" fill="none" stroke="#e8743b" stroke-width="5" stroke-linecap="round"/>

  <!-- taps -->
  <g fill="#440154">
    <circle cx="700" cy="70" r="6"/><circle cx="700" cy="160" r="6"/><circle cx="700" cy="100" r="5"/>
  </g>
  <text x="712" y="66" font-size="12" fill="#440154">tap</text>

  <!-- dead leg / stagnation -->
  <path d="M470 110 H520" fill="none" stroke="#35b779" stroke-width="5" stroke-dasharray="2 5" stroke-linecap="round"/>

  <!-- callouts -->
  <g font-size="13">
    <line x1="520" y1="110" x2="780" y2="120" stroke="#9aa0ab" stroke-width="1"/>
    <circle cx="520" cy="110" r="4" fill="#440154"/>
    <text x="785" y="112" font-weight="700" fill="#440154">Living</text>
    <text x="785" y="128" fill="#555">biofilm, Legionella</text>

    <line x1="470" y1="200" x2="780" y2="190" stroke="#9aa0ab" stroke-width="1"/>
    <circle cx="470" cy="200" r="4" fill="#31688e"/>
    <text x="785" y="185" font-weight="700" fill="#31688e">Reacting</text>
    <text x="785" y="201" fill="#555">disinfectant, metals</text>

    <line x1="604" y1="260" x2="780" y2="262" stroke="#9aa0ab" stroke-width="1"/>
    <circle cx="604" cy="260" r="4" fill="#c2410c"/>
    <text x="785" y="257" font-weight="700" fill="#c2410c">Heating</text>
    <text x="785" y="273" fill="#555">energy vs. safety</text>

    <line x1="470" y1="330" x2="780" y2="335" stroke="#9aa0ab" stroke-width="1"/>
    <circle cx="470" cy="330" r="4" fill="#218a58"/>
    <text x="785" y="330" font-weight="700" fill="#218a58">Moving</text>
    <text x="785" y="346" fill="#555">pressure, stagnation</text>
  </g>

  <text x="20" y="40" font-size="20" font-weight="700" fill="#222">Between the street and the tap,</text>
  <text x="20" y="66" font-size="20" font-weight="700" fill="#222">water changes.</text>
</svg>
